<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tech book club landing page">
    <link rel="stylesheet" href="/book-club-landing-page/styles/reset.css">
    <link rel="stylesheet" href="/book-club-landing-page/styles/style.css">
    <link rel="shortcut icon" href="/book-club-landing-page/assets/favicon-32x32.png" type="image/png">
    <title>Tech book club landing page</title>
</head>

<body>
    <div class="container">
        <div class="hero__header--bg">
            <header class="header__box">
                <img src="./assets/logo.svg" alt="Tech book club logo" class="header__logo">
            </header>
            <section class="hero__box">
                <div class="content__box">
                    <h1 class="hero__title">Join the ultimate tech book club</h1>
                    <p class="hero__description">Turn your reading time into learning time with fellow tech enthusiasts. Get curated recommendations, join vibrant discussions, and level up your skills one chapter at a time.</p>
                    <a href="#" class="hero__link">review membership options</a>
                    <div class="people__box">
                        <img src="./assets/image-avatars.webp" alt="people photo" class="people__image">
                        <div class="details__box">
                            <div class="stars__box">
                                <img src="./assets/icon-star.svg" alt="5 stars" class="people__stars">
                                <img src="./assets/icon-star.svg" alt="5 stars" class="people__stars">
                                <img src="./assets/icon-star.svg" alt="5 stars" class="people__stars">
                                <img src="./assets/icon-star.svg" alt="5 stars" class="people__stars">
                                <img src="./assets/icon-star.svg" alt="5 stars" class="people__stars">
                            </div>
                            <span class="people__description">200+ developers joined already</span>
                        </div>
                    </div>
                </div>
                <picture class="hero__image">
                    <source media="(min-width: 700px)" srcset="./assets/image-hero-tablet.webp">
                    <source media="(min-width: 1000px)" srcset="./assets/image-hero-desktop.webp">
                    <img src="./assets/image-hero-mobile.webp" alt="coworkers">
                </picture>
            </section>
        </div>
    </div>
</body>

</html>
